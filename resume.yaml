cv:
  name: "Yashi Mishra"
  location: "Jaipur, India"
  email: "mishrayashi2208@gmail.com"
  phone: "tel:+919354048795"
  tagline: "AI Data Engineer · Voice AI & LLM Systems"
  social_networks:
    - network: "LinkedIn"
      username: "mishrayashi"
  sections:
    intro:
      - "AI & Data Engineer with **4 years** of experience bridging large-scale data engineering with production AI systems — specifically real-time **Voice AI** and **LLM-integrated** pipelines. Specialized in Python (PySpark), SQL, Databricks, and cloud-native architectures (Azure/GCP/AWS), with deep focus on data quality, real-time analytics, and conversational AI."
      - "Proven track record building **end-to-end real-time Voice AI pipelines** (Whisper STT + Deepgram + ElevenLabs) for live conversational interview systems, authoring **300+ automated data-quality rules** across high-volume **UAE government** pipelines on Microsoft Fabric + Azure Databricks, **cutting frontend SQL query latency by 30%+ to under 2 seconds**, and contributing to **distributed fine-tuning of large-scale multilingual LLMs**."
      - "Delivered **onsite** with enterprise and government stakeholders in **Dubai and Abu Dhabi**, coordinating cross-functional teams across UAE/UK/India time zones to translate ministry-level requirements into production data systems — while continuously driving adoption of emerging Voice AI and LLM tooling into live client engagements."

    technologies:
      - label: "AI & Voice / LLM Systems"
        details: "Whisper STT, Deepgram, ElevenLabs, OpenAI APIs, Hugging Face, RAG, Conversational AI, Phoneme Synchronization, Voice Emotion Tuning, Prompt Engineering, Ray"
      - label: "Data Engineering"
        details: "PySpark, SQL, Databricks, BigQuery, Microsoft Fabric, Unity Catalog, dbt, Snowflake, Airflow, ETL/ELT, Star/Snowflake Schemas, Data Quality, Data Lineage, Medallion Architecture, Real-Time & Batch Processing"
      - label: "Backend, Cloud & Viz"
        details: "Python, FastAPI, REST APIs, PostgreSQL, MySQL, MongoDB, Azure (Databricks/ADF/ADLS Gen2/AzureML), GCP (BigQuery/Pub-Sub/Cloud Run/Functions), AWS (S3/Lambda/Glue), Terraform, Docker, CI/CD, ReactJS, Looker Studio, Power BI, Tableau, N8N, Make.com"

    experience:
      - company: "FiftyFive Technologies"
        position: "Senior Data Engineer"
        location: "Jaipur, RJ (Hybrid)"
        start_date: "2022-08"
        end_date: "2026-05"
        summary: "Delivered end-to-end data and AI platforms across enterprise and government clients in **UAE, UK, and India** — spanning government data governance, real-time Voice AI, IoT cold-chain monitoring, LLM infrastructure, and analytics. Owned scoping, architecture, and production delivery; led international **onsite** engagements in Dubai and Abu Dhabi; and drove org-wide adoption of emerging Voice AI / LLM tooling from R&D into live client work.\\ **Client Engagements:**"
        highlights:
          - "**ODA – UAE Aid (Govt. Data Governance · Onsite Abu Dhabi/Dubai)**: Took ownership of a government-grade data quality platform on **Microsoft Fabric + Azure Databricks** for the UAE's Official Development Assistance program — authoring **300+ automated validation rules** spanning schema, business-logic, and cross-system integrity checks for audit-grade pipelines. Designed the **logical/physical data model** and KPI framework that standardized reporting across ministry stakeholders, rolled out **Unity Catalog** for centralized lineage and access control, and partnered onsite with government teams in Abu Dhabi and Dubai to translate ministry requirements directly into production schemas."
          - "**AI Interview Assistant (Real-Time Voice & NLP Pipeline)**: Architected an end-to-end real-time conversational AI loop combining **Whisper** (transcription), **Deepgram** (low-latency streaming STT), and **ElevenLabs** (TTS synthesis) for live human-AI interview sessions. Engineered **word-level timestamp alignment** and **phoneme-level synchronization** to eliminate audible artifacts during turn-taking, layered **emotion-conditioned voice tuning** for context-aware tonal response, and shipped a **ReactJS** UI driving live multi-turn interview flows."
          - "**QxLab AI (LLM Infrastructure & Fine-Tuning)**: Designed the **job orchestration and monitoring layer** for production LLM workflows — handling dependency graphs, **data lineage tracking**, and graceful failure recovery across distributed training runs on Azure (Blob Storage, SQL, **Ray**). Contributed to **distributed fine-tuning and inference optimization of large-scale multilingual LLMs** on the Hugging Face stack, plus integration with OpenAI APIs for downstream serving."
          - "**AGY Logistics (Real-Time Cold-Chain IoT · GCP)**: Built a production monitoring stack ingesting **Samsara** telematics and **Ditat** TMS feeds into **BigQuery**, organized as a **Bronze → Silver → Gold → Diamond medallion architecture** — with the Diamond layer driving automated transformations, alert dispatch, and data profiling. Exposed downstream APIs via **FastAPI** on **Cloud Run + Cloud Functions**, and wired automated **Slack alerting** on critical temperature thresholds across reefer fleets — orchestrating workflow glue via **N8N** and **Make.com**."
          - "**Smart Cloud Kitchen (Query Perf + Analytics)**: Rewrote critical SQL queries and stored procedures across **PostgreSQL** and **BigQuery**, **cutting frontend query latency by 30%+ to under 2 seconds** for live operational dashboards. Built **FastAPI** services on **Cloud Run** and interactive **Looker Studio** dashboards surfacing weekly performance trends and per-store failure patterns for cloud-kitchen ops teams."
          - "**TopGun (Edge ML · Acoustic Event Detection)**: Built a real-time **gunshot detection** system using **TensorFlow Lite** with adaptive signal-processing to disambiguate overlapping events in noisy multi-shooter environments. Stood up the supporting data plane on **AWS S3 + MongoDB** for telemetry ingestion, labeled-event storage, and downstream model retraining."

    education:
      - institution: "GLA University"
        location: "Mathura, UP"
        area: "Computer Science & Engineering"
        degree: "B.Tech"
        start_date: "2019-08"
        end_date: "2023-06"
        highlights:
          - "**GPA:** 81.9%"

design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1.05cm
    bottom_margin: 1.05cm
    left_margin: 1.05cm
    right_margin: 1.05cm
    show_page_numbering: false
    show_last_updated_date: false
  colors:
    text: "#011629"
    name: "#124d86"
    connections: "#124d86"
    section_titles: "#124d86"
    links: "#124d86"
    last_updated_date_and_page_numbering: "grey"
  text:
    font_family: Inter
    font_size: 9.6pt
    alignment: justified
    date_and_location_column_alignment: right
    leading: "0.65em"
  header:
    name_font_family: Inter
    name_font_size: 16pt
    name_bold: true
    small_caps_for_name: false
    photo_width: 3.5cm
    vertical_space_between_name_and_connections: 0.4cm
    vertical_space_between_connections_and_first_section: 0.4cm
    horizontal_space_between_connections: 0.25cm
    connections_font_family: Inter
    separator_between_connections: '|'
    use_icons_for_connections: false
    make_connections_links: true
    alignment: center
  section_titles:
    type: with-full-line
    font_family: Inter
    font_size: 1.3em
    bold: true
    small_caps: true
    vertical_space_above: 0.4cm
    vertical_space_below: 0.2cm
  entries:
    date_and_location_width: 4cm
    left_and_right_margin: 0cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 1.2em
    allow_page_break_in_sections: true
    allow_page_break_in_entries: true
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: •
    nested_bullet: ◦
    top_margin: 0.22cm
    left_margin: 0.3cm
    vertical_space_between_highlights: 0.22cm
    horizontal_space_between_bullet_and_highlight: 0.4em
    summary_left_margin: 0.2cm
  entry_types:
    one_line_entry:
      template: '**LABEL:** DETAILS'
    education_entry:
      main_column_first_row_template: |-
        **INSTITUTION**
        DEGREE in AREA
      degree_column_template: ''
      degree_column_width: 3cm
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    normal_entry:
      main_column_first_row_template: '**NAME**'
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    experience_entry:
      main_column_first_row_template: |-
        **COMPANY**
        POSITION
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    publication_entry:
      main_column_first_row_template: "**TITLE**"
      main_column_second_row_template: |-
        AUTHORS
        URL (JOURNAL)
      main_column_second_row_without_journal_template: |-
        AUTHORS
        URL
      main_column_second_row_without_url_template: |-
        AUTHORS
        JOURNAL
      date_and_location_column_template: "DATE"

