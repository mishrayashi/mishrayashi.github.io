cv:
  name: "Yashi Mishra"
  location: "Jaipur, India"
  email: "mishrayashi2208@gmail.com"
  phone: "tel:+919354048795"
  website: "https://mishrayashi.github.io"
  tagline: "AI & Data Engineer"
  social_networks:
    - network: "LinkedIn"
      username: "mishrayashi"
    - network: "GitHub"
      username: "mishrayashi" 

  sections:
    intro:
      - "AI & Data Engineer with **4 years** of experience bridging large-scale data engineering with production AI systems - Python (PySpark), SQL, Databricks, and cloud-native architectures across Azure/GCP/AWS, with focus on data quality and real-time pipelines."
      - "Proven track record authoring **300+ data-quality rules** for **UAE government** pipelines on Microsoft Fabric + Azure Databricks, **fine-tuning multilingual LLMs** with parallel/batch training pipelines, **cutting SQL latency 30%+ to under 2 seconds**, and prototyping **real-time Voice AI** systems (Whisper + Deepgram + ElevenLabs) with full production architecture estimates."
      - "Delivered **onsite** with enterprise and government stakeholders in **Dubai and Abu Dhabi**, translating ministry-level requirements into production data systems across UAE/UK/India time zones."
    technologies:
      - label: "AI & Voice / LLM Systems"
        details: "Whisper STT, Deepgram, ElevenLabs, OpenAI APIs, Hugging Face, RAG, Conversational AI, Prompt Engineering, Ray"
      - label: "Data Engineering"
        details: "PySpark, SQL, Databricks, BigQuery, Microsoft Fabric, Unity Catalog, dbt, Snowflake, Airflow, ETL/ELT, Star/Snowflake Schemas, Data Quality, Medallion Architecture, Real-Time & Batch Processing"
      - label: "Backend, Cloud & Viz"
        details: "Python, FastAPI, REST APIs, PostgreSQL, MySQL, MongoDB, Azure (Databricks/ADF/ADLS Gen2/AzureML), GCP (BigQuery/Pub-Sub/Cloud Run/Functions), AWS (S3/Lambda/Glue), Terraform, Docker, CI/CD, ReactJS, Looker Studio, Power BI, Tableau, N8N, Make.com"

    experience:
      - company: "FiftyFive Technologies"
        position: "Data Engineer"
        location: "Jaipur, RJ (Hybrid)"
        start_date: "2022-08"  
        end_date: "2026-05"
        summary: "Owned scoping, architecture, and production delivery for enterprise and government clients across UAE, UK, and India; led onsite engagements with ministry stakeholders.\\ **Client Engagements:**"
        highlights:
          - "**AI Interview Assistant (Voice & NLP PoC)**: Built a proof-of-concept real-time conversational pipeline — **Whisper + Deepgram + ElevenLabs** — for a client exploring AI-driven interviews. Researched the production architecture end-to-end, sized the engineering estimate, and presented the build plan to the client."
          - "**AGY Logistics (Cold-Chain IoT · GCP)**: Owned the alerting and workflow automation layer — **automated Slack notifications** on critical reefer-temperature thresholds, orchestrated via **N8N + Make.com**. Supported the broader **Bronze→Diamond medallion** architecture on GCP with data quality checks and end-to-end testing."
          - "**QxLab AI (LLM Fine-Tuning Research)**: Fine-tuned multiple large language models on the Hugging Face stack for production inference. Built and optimized **parallel and batch training pipelines** on distributed Azure (Ray) infrastructure for multilingual LLM workloads."
          - "**ODA – UAE Aid (with Artefact · Abu Dhabi/Dubai · Onsite)**: Stood up the data quality platform for the UAE Official Development Assistance program — authored **300+ validation rules** across schema, business-logic, and cross-system integrity on **Microsoft Fabric + Azure Databricks** for audit-grade ministry pipelines. Designed the logical/physical data model and KPI framework that standardized cross-ministry reporting, and rolled out **Unity Catalog** for centralized lineage and access control."
          - "**Smart Cloud Kitchen (Query Perf)**: Rewrote critical SQL queries and stored procedures across PostgreSQL + BigQuery — **cut frontend query latency 30%+ to under 2 seconds** for live ops dashboards. Built FastAPI services on Cloud Run and Looker Studio dashboards surfacing weekly trends and per-store failure patterns."
          - "**ZipApply (Job Platform Backend)**: Designed the backend data architecture for candidate-recruiter matching using a **life-quality scoring** signal with integrated email workflows. Built **HPCC ECL** ETL pipelines (Roxie real-time queries, cron-based scheduling) and **OpenAI-powered tools for resume enhancement and cover-letter generation**."
  
    education:
      - institution: "GLA University"
        location: "Mathura, UP"
        area: "Computer Science & Engineering"
        degree: "B.Tech"
        start_date: "2019-08"
        end_date: "2023-06"
        highlights:
          - "**Aggregate:** 81.9%"

    professional_projects:
      - name: "ODA – UAE Aid · Government Data Governance (with Artefact)"
        date: "2025-11"  
        show_on_resume: false
        highlights:
          - "Took ownership of a government-grade data quality platform on Microsoft Fabric + Azure Databricks for the UAE's Official Development Assistance program — authoring 300+ automated validation rules spanning schema, business-logic, and cross-system integrity checks for audit-grade pipelines."
          - "Designed the logical/physical data model and KPI framework that standardized reporting across ministry stakeholders."
          - "Rolled out Unity Catalog for centralized lineage and access control."
          - "Partnered onsite with government teams in Abu Dhabi and Dubai to translate ministry requirements directly into production schemas."

      - name: "AI Interview Assistant · Real-Time Voice & NLP Pipeline"
        date: "2026-04"
        show_on_resume: false
        highlights:
          - "Architected an end-to-end real-time conversational AI loop combining Whisper (transcription), Deepgram (low-latency streaming STT), and ElevenLabs (TTS synthesis) for live human-AI interview sessions."
          - "Engineered word-level timestamp alignment and phoneme-level synchronization to eliminate audible artifacts during turn-taking."
          - "Layered emotion-conditioned voice tuning for context-aware tonal response."
          - "Shipped a ReactJS UI driving live multi-turn interview flows."

      - name: "QxLab AI · LLM Infrastructure & Fine-Tuning"
        date: "2023-12"
        show_on_resume: false
        highlights:
          - "Designed the job orchestration and monitoring layer for production LLM workflows — handling dependency graphs, data lineage tracking, and graceful failure recovery across distributed training runs on Azure (Blob Storage, SQL, Ray)."
          - "Contributed to distributed fine-tuning and inference optimization of large-scale multilingual LLMs on the Hugging Face stack, plus integration with OpenAI APIs for downstream serving."

      - name: "AGY Logistics · Real-Time Cold-Chain IoT (GCP)"
        date: "2025-04"
        show_on_resume: false
        highlights:
          - "Built a production monitoring stack ingesting Samsara telematics and Ditat TMS feeds into BigQuery, organized as a Bronze → Silver → Gold → Diamond medallion architecture — with the Diamond layer driving automated transformations, alert dispatch, and data profiling."
          - "Exposed downstream APIs via FastAPI on Cloud Run + Cloud Functions."
          - "Wired automated Slack alerting on critical temperature thresholds across reefer fleets, orchestrating workflow glue via N8N and Make.com."

      - name: "LoopKitchen"
        date: "2022-10"
        show_on_resume: false
        highlights:
          - "Rewrote critical SQL queries and stored procedures across PostgreSQL and BigQuery, cutting frontend query latency by 30%+ to under 2 seconds for live operational dashboards."
          - "Built FastAPI services on Cloud Run and interactive Looker Studio dashboards surfacing weekly performance trends and per-store failure patterns for cloud-kitchen ops teams."

      - name: "ZipApply · Job Platform Backend"
        date: "2022-12"
        show_on_resume: false
        highlights:
          - "Designed the backend data architecture for candidate-recruiter matching using a life-quality scoring signal with integrated email workflows."
          - "Built ETL pipelines on HPCC ECL with automated scheduling via cron jobs and Roxie real-time query services."
          - "Built OpenAI-powered tools for resume enhancement and cover-letter generation as part of the candidate-facing layer."
          
design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1.05cm
    bottom_margin: 1.05cm
    left_margin: 1.05cm
    right_margin: 1.05cm
    show_page_numbering: false
    show_last_updated_date: false
  colors:
    text: "#011629"
    name: "#124d86"
    connections: "#124d86"
    section_titles: "#124d86"
    links: "#124d86"
    last_updated_date_and_page_numbering: "grey"
  text:
    font_family: Inter
    font_size: 9.6pt
    alignment: justified
    date_and_location_column_alignment: right
    leading: "0.65em"
  header:
    name_font_family: Inter
    name_font_size: 16pt
    name_bold: true
    small_caps_for_name: false
    photo_width: 3.5cm
    vertical_space_between_name_and_connections: 0.4cm
    vertical_space_between_connections_and_first_section: 0.4cm
    horizontal_space_between_connections: 0.25cm
    connections_font_family: Inter
    separator_between_connections: '|'
    use_icons_for_connections: false
    make_connections_links: true
    alignment: center
  section_titles:
    type: with-full-line
    font_family: Inter
    font_size: 1.3em
    bold: true
    small_caps: true
    vertical_space_above: 0.4cm
    vertical_space_below: 0.2cm
  entries:
    date_and_location_width: 4cm
    left_and_right_margin: 0cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 1.2em
    allow_page_break_in_sections: true
    allow_page_break_in_entries: true
    short_second_row: false
    show_time_spans_in: []
  highlights:
    bullet: •
    nested_bullet: ◦
    top_margin: 0.22cm
    left_margin: 0.3cm
    vertical_space_between_highlights: 0.22cm
    horizontal_space_between_bullet_and_highlight: 0.4em
    summary_left_margin: 0.2cm
  entry_types:
    one_line_entry:
      template: '**LABEL:** DETAILS'
    education_entry:
      main_column_first_row_template: |-
        **INSTITUTION**
        DEGREE in AREA
      degree_column_template: ''
      degree_column_width: 3cm
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    normal_entry:
      main_column_first_row_template: '**NAME**'
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    experience_entry:
      main_column_first_row_template: |-
        **COMPANY**
        POSITION
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: |-
        LOCATION
        DATE
    publication_entry:
      main_column_first_row_template: "**TITLE**"
      main_column_second_row_template: |-
        AUTHORS
        URL (JOURNAL)
      main_column_second_row_without_journal_template: |-
        AUTHORS
        URL
      main_column_second_row_without_url_template: |-
        AUTHORS
        JOURNAL
      date_and_location_column_template: "DATE"

